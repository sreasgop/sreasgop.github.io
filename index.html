<html>

<head>
    <title>Rose</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        .scene {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }


        .text {
            text-align: center;
            max-width: 520px;
            margin-top: 350px;
            padding: 9x;
        }

        .text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            color: #ad254c;
        }

        .text p {
            color: #e0aab9;
            line-height: 1.7;
            margin-top: 10px;
        }

        /* 📱 Mobile View */
        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            .container {
                transform: scale(0.45) translateY(-40px);
            }

            .glass {
                width: 200px;
                left: -60px;
            }

            .text {
                margin-top: 250px;
            }


            .text h1 {
                padding: 0 9px;
                font-size: 1.8rem;
            }

            .text p {
                padding: 0 16px;
                font-size: 0.95rem;
                line-height: 1.6;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="glass"></div>
        <div class="thorns">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="glow"></div>
        <div class="rose-leaves">
            <div></div>
            <div></div>
        </div>
        <div class="rose-petals">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="sparkles">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
    <div class="scene">
        <div class="text">

</html>
